AWSTemplateFormatVersion: "2010-09-09"
Description: Claude Code Workshop - shared internal API (CloudFront + HTTP API + Lambda + DynamoDB + S3 docs)

Parameters:
  OriginSecret:
    Type: String
    NoEcho: true
    Description: CloudFront -> 오리진 비밀 헤더 값. API Gateway 직접 호출을 막는다.
  StackPrefix:
    Type: String
    Default: ccw-lab
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${StackPrefix}-api"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn

  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-api"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt FnRole.Arn
      Timeout: 10
      MemorySize: 256
      Code: ./lambda            # `aws cloudformation package` 가 S3로 올린다
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ORIGIN_SECRET: !Ref OriginSecret

  # 계정 정책상 퍼블릭 Lambda Function URL이 차단되어 HTTP API를 CloudFront 오리진으로 쓴다.
  # payload 2.0 이벤트는 Function URL과 같은 형식이라 handler.py 변경이 없다.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${StackPrefix}-api"
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Fn.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /v1/{proxy+}
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # API Gateway 주소로 직접 들어오는 요청이 Lambda까지 몰리지 않게 한다. 70명 실습 기준 여유 있게 잡았다.
      DefaultRouteSettings:
        ThrottlingRateLimit: 100
        ThrottlingBurstLimit: 200

  HttpApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v1/*"

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${StackPrefix}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AuthCheck:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${StackPrefix}-auth-check"
      AutoPublish: true
      FunctionConfig: { Comment: Bearer token format check for /v1/*, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var h = req.headers.authorization;
          var ok = h && /^Bearer lab-[a-z0-9]{8}$/.test(h.value);
          if (!ok) {
            return { statusCode: 401, statusDescription: 'Unauthorized',
              headers: { 'content-type': { value: 'application/json; charset=utf-8' } },
              body: '{"error":"unauthorized","message":"Authorization: Bearer lab-xxxxxxxx 헤더가 필요합니다."}' };
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${StackPrefix} workshop API + docs"
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginCustomHeaders:
              - { HeaderName: x-lab-origin, HeaderValue: !Ref OriginSecret }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt AuthCheck.FunctionMetadata.FunctionARN }

Outputs:
  BaseUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  TableName:
    Value: !Ref Table
  SiteBucket:
    Value: !Ref SiteBucket
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
    Description: 직접 호출은 비밀 헤더가 없어 403. CloudFront 주소를 쓴다.
