# api.slack.com/apps → Create New App → From an app manifest → 워크샵 워크스페이스 선택 → 이 내용 붙이기
display_information:
  name: Workshop Lab Bot
  description: Claude Code 워크샵 실습 결과를 참가자 본인 DM으로 전달합니다.
  background_color: "#232f3e"
features:
  bot_user:
    display_name: lab-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # DM 메시지 전송
      - im:write            # DM 채널 열기 (conversations.open)
      - users:read          # 사용자 조회
      - users:read.email    # 이메일로 사용자 찾기 (users.lookupByEmail)
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
